      <div class="future-column-links"><!-- 链接将放在这里 --></div>

      <div class="future-column-links"><!-- 链接将放在这里 --></div>
    </section>

    <section class="future-column">
      <p>在欣赏AI成果的同时，数学工作者是否有义务向其他数学工作者及公众正确介绍AI的能力，使人们对其形成客观认知，从而避免对AI的过度轻视或过度吹捧？</p>
